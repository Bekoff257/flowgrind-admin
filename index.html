<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotes App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Flow Grind Admin</h1>

        <form id="quote-form">
            <input type="text" id="title" name="title" placeholder="Quote Title" required>
            <input type="text" id="description" name="description" placeholder="Quote Description" required>
            <button type="submit">Add Quote</button>
        </form>

        <div id="quotes-list"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
